[project]
name = "sistema-dds"
version = "2.4.1"
description = "Dimensionamento e dinâmica da suspensão do FSAE Elétrico da equipe Tupã (USP)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy",
    "scipy",
    "openpyxl",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# EDR-043: o `uv sync` instala o projeto em modo editável e põe python/ no caminho
# de import, para que os testes em tests/ achem os módulos sem mexer no sys.path.
[tool.hatch.build]
dev-mode-dirs = ["python"]

[tool.hatch.build.targets.wheel]
only-include = ["python"]
