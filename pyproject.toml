[project]
name = "sistema-dds"
version = "2.4.1"
description = "Dimensionamento e dinâmica da suspensão do FSAE Elétrico da equipe Tupã (USP)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy",
    "scipy",
    "openpyxl",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

# EDR-043: o `uv sync` instala o projeto em modo editável e põe python/ no caminho
# de import, para que os testes em tests/ achem os módulos de python/ sem mexer no
# sys.path. O wheel (instalação não editável) põe os mesmos módulos na raiz.
[tool.hatch.build]
dev-mode-dirs = ["python"]

[tool.hatch.build.targets.wheel]
only-include = ["python"]
sources = ["python"]
exclude = ["*.md"]

[dependency-groups]
dev = [
    "pywin32>=306 ; sys_platform == 'win32'",
]
